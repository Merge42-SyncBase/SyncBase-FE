server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  server_tokens off;
  client_max_body_size 101m;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

  location = /healthz {
    default_type application/json;
    return 200 '{"status":"ok","runtime":"web"}';
  }

  location = /readyz {
    proxy_pass http://api:8080/readyz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location ^~ /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 125s;
    proxy_read_timeout 125s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ \.mjs$ {
    try_files $uri =404;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
    types {
      application/javascript mjs;
    }
  }

  location /assets/ {
    try_files $uri =404;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
